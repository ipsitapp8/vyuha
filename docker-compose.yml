services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyuha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyuha_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vyuha}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vyuha} -d ${POSTGRES_DB:-vyuha}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-vyuha}:${POSTGRES_PASSWORD:-vyuha_dev_password}@db:5432/${POSTGRES_DB:-vyuha}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32-chars-or-more}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Creates the demo accounts and Op Silent Ridge on start so a fresh stack is usable offline.
      # Set to false once real accounts exist.
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # offline = bundled PMTiles base map (works with the network unplugged); online = hosted style.
        VITE_MAP_MODE: ${MAP_MODE:-offline}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  pgdata:
