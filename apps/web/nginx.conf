server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # module workers (MapLibre) must be served with a JavaScript MIME type
  types {
    application/javascript mjs;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # PMTiles are read with HTTP Range requests, so serve them as plain static bytes: no gzip, ranges on,
  # and a real 404 (not the SPA page) when the archive has not been fetched.
  location /tiles/ {
    gzip off;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /map-assets/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
