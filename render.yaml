# Render Blueprint: one web service (web app + API + live socket) and a PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. See docs/DEPLOY_RENDER.md.
databases:
  - name: vyuha-db
    databaseName: vyuha
    user: vyuha
    plan: free

services:
  - type: web
    name: vyuha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Exactly one instance: live exercises are held in this process's memory (see docs/ARCHITECTURE.md,
    # "Single instance"). Do not scale out or enable autoscaling.
    numInstances: 1
    # 503 while the database is unreachable, so a deploy only goes live once it can serve.
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vyuha-db
          property: connectionString
      # Random value generated once by Render; read it in the dashboard under Environment.
      - key: JWT_SECRET
        generateValue: true
      # Public prototype: the demo accounts use the password shown on the sign-in pages, and every start sets
      # them back to it. DEMO_MODE=true is the explicit opt-in that lets production run with that published
      # password (it logs a warning on every start); without it the server refuses. For a real deployment
      # remove DEMO_MODE and SEED_RESET_PASSWORDS, use generateValue: true for SEED_PASSWORD and build the
      # web app with VITE_SHOW_DEMO_LOGIN=false.
      - key: DEMO_MODE
        value: 'true'
      - key: SEED_PASSWORD
        value: Vyuha@123
      - key: SEED_RESET_PASSWORDS
        value: 'true'
      # Creates the demo accounts and Op Silent Ridge on start (safe to leave on: it only adds what is missing).
      - key: SEED_ON_START
        value: 'true'
      - key: LOG_LEVEL
        value: info
