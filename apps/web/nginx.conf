# HSTS only when the TLS-terminating proxy in front says the request came over https: on plain http
# browsers ignore the header anyway, and this container never terminates TLS itself.
map $http_x_forwarded_proto $vyuha_hsts {
  https 'max-age=31536000';
  default '';
}

server {
  # 8080: an unprivileged process cannot bind ports below 1024.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # A `types` block here replaces the inherited MIME table, so the standard one is included first:
  # without it every file, index.html included, is served as application/octet-stream and the browser
  # downloads the page instead of showing it.
  include /etc/nginx/mime.types;
  # module workers (MapLibre) must be served with a JavaScript MIME type
  types {
    application/javascript mjs;
  }

  # CSP, nosniff, frame and referrer policy, Permissions-Policy, COOP, HSTS. Generated at build time
  # (apps/web/src/lib/securityHeaders.ts). Every location that adds its own headers includes it again,
  # because nginx drops inherited add_header lines in such a location.
  include /etc/nginx/vyuha-security-headers.conf;

  # PMTiles are read with HTTP Range requests, so serve them as plain static bytes: no gzip, ranges on,
  # and a real 404 (not the SPA page) when the archive has not been fetched.
  location /tiles/ {
    gzip off;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/vyuha-security-headers.conf;
    try_files $uri =404;
  }

  location /map-assets/ {
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/vyuha-security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
