# Continuous integration for pull requests to main and pushes to main.
#
# Two jobs run in parallel:
#   checks    formatting, lint, typecheck (all workspaces and the e2e suite), unit and integration tests
#             (engine coverage gate, ground-truth leak guard, session ownership, socket revalidation,
#             token revocation, deployment config guards) and the production builds.
#   database  migrations on a fresh disposable PostgreSQL, a schema drift check, the seed, and the
#             Playwright end-to-end suite (instructor and trainees through to the PDF export).
#
# No repository secrets are used: every credential below is a throwaway value for the CI database and
# the test server. The `pull_request` trigger (never `pull_request_target`) gives fork pull requests a
# read-only token and no secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json (pnpm 9.15.9).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 LTS, the same line as the runtime images (node:24-slim) and .nvmrc. The test toolchain
          # needs 22.22+ / 24.15+ (jsdom 30, vitest 5).
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server's types come from the generated Prisma client.
      - run: pnpm --filter @vyuha/server db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyuha_ci
          POSTGRES_PASSWORD: vyuha_ci_only
          POSTGRES_DB: vyuha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyuha_ci -d vyuha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable values for this job's own database and dev server; not secrets, never production.
      DATABASE_URL: postgresql://vyuha_ci:vyuha_ci_only@localhost:5432/vyuha_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: warn
      # Playwright drives the Google Chrome that ships on the ubuntu-latest image.
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The seed and the dev server import the generated Prisma client; pnpm does not generate it on install.
      - run: pnpm --filter @vyuha/server db:generate
      - name: Validate the Prisma schema
        working-directory: apps/server
        run: pnpm exec prisma validate
      - name: Apply every migration to an empty database
        run: pnpm --filter @vyuha/server db:deploy
      - name: Fail if the migrations and the schema disagree
        working-directory: apps/server
        run: >-
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed scenarios and demo accounts
        run: pnpm db:seed
      - name: End-to-end tests
        run: pnpm e2e
      - name: Keep Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
